[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-control-plane"
version = "0.1.0"
description = "Proprietary deterministic AI security control plane"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "flatbuffers>=25.2,<26",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

test = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "native_isolation: requires a host-native OS isolation boundary",
]

[tool.setuptools]
py-modules = ["sdk"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent_security*",
  "api*",
  "app*",
  "content_security*",
  "core*",
  "detection*",
  "execution*",
  "evaluation*",
  "input_security*",
  "output_security*",
  "policy*",
  "resource_security*",
  "runtime*",
  "secret_detection*",
  "telemetry*",
]
