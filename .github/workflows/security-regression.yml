name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-regression:
    name: ${{ matrix.phase }} security regression (${{ matrix.label }})
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: phase-0-1
            label: core
            tests: tests/unit/test_config.py tests/unit/test_event_and_decision_models.py tests/unit/test_risk_engine.py tests/unit/test_rule_engine.py tests/unit/test_audit.py tests/unit/test_policy_engine.py tests/unit/test_policy_reason_propagation.py tests/unit/test_sdk.py tests/integration/test_health.py tests/integration/test_cli.py tests/integration/test_security_pipeline.py tests/integration/test_dashboard_api.py
          - phase: phase-2
            label: prompt
            tests: tests/unit/test_prompt_detectors.py tests/unit/test_prompt_import_order.py tests/unit/test_prompt_normalizer.py tests/unit/test_onnx_hook.py tests/security/test_prompt_firewall.py tests/integration/test_prompt_api.py
          - phase: phase-3
            label: content
            tests: tests/unit/test_content_security.py tests/security/test_content_firewall.py tests/integration/test_content_api.py
          - phase: phase-4
            label: tools
            tests: tests/unit/test_plan_models.py tests/unit/test_plan_chain_policy.py tests/unit/test_mcp_result_capabilities.py tests/security/test_tool_firewall.py tests/security/test_mcp_gateway.py tests/security/test_mcp_result_gateway.py tests/security/test_plan_validator.py tests/security/test_tool_resource_integration.py tests/integration/test_authorization_api.py
          - phase: phase-5
            label: output
            tests: tests/unit/test_secret_detector.py tests/security/test_output_guard.py tests/integration/test_output_api.py
          - phase: phase-6
            label: resource
            tests: tests/security/test_database_api_firewalls.py tests/security/test_filesystem_firewall.py tests/security/test_network_firewall.py tests/security/test_process_firewall.py
            pytest_args: '-m "not native_isolation"'
          - phase: phase-7
            label: runtime
            tests: tests/unit/test_runtime_anomaly.py tests/security/test_runtime_monitor.py tests/integration/test_runtime_api.py
          - phase: phase-8
            label: red-team
            tests: tests/unit/test_redteam_models.py tests/unit/test_redteam_runner.py tests/security/test_redteam_security.py tests/integration/test_redteam_regression.py
          - phase: phase-9
            label: sandbox-core
            tests: tests/unit/test_sandbox_capabilities.py tests/unit/test_sandbox_limits.py tests/unit/test_sandbox_readiness.py tests/security/test_sandbox_isolation.py
          - phase: phase-9
            label: appcontainer-native
            runner: windows-11-arm
            tests: tests/security/test_process_firewall.py::test_appcontainer_enforces_token_network_and_read_only_workspace
          - phase: phase-10
            label: append-basic
            tests: tests/unit/test_append_only_audit.py::test_append_only_sink_chains_and_verifies tests/unit/test_append_only_audit.py::test_append_only_sink_rejects_relative_and_symlink_paths tests/unit/test_append_only_audit.py::test_append_only_sink_detects_tampering tests/unit/test_append_only_audit.py::test_independent_sinks_refresh_tail_under_cross_process_lock
          - phase: phase-10
            label: append-multiprocess
            tests: tests/unit/test_append_only_audit.py::test_multiple_processes_preserve_one_hash_chain
          - phase: phase-10
            label: append-replication
            tests: tests/unit/test_append_only_audit.py::test_required_replica_failure_prevents_local_success tests/unit/test_append_only_audit.py::test_directory_worm_replica_is_idempotent_and_rejects_replacement
          - phase: phase-10
            label: append-segments
            tests: tests/unit/test_append_only_audit.py::test_segment_rotation_retention_and_recovery_verification tests/unit/test_append_only_audit.py::test_segment_recovery_rejects_manifest_tampering
          - phase: phase-10
            label: append-only-dacl
            tests: tests/unit/test_append_only_audit.py::test_windows_audit_file_removes_inherited_acl
          - phase: phase-10
            label: r2-unit
            tests: tests/unit/test_r2_audit_replica.py tests/unit/test_async_telemetry.py
          - phase: phase-11
            label: resilience
            tests: tests/unit/test_ci_policy.py tests/unit/test_fault_injection.py tests/unit/test_resilience_runner.py tests/unit/test_resilience_catalog.py tests/unit/test_resilience_evidence.py tests/integration/test_fault_pipeline.py tests/integration/test_phase11_fault_matrix.py
          - phase: phase-12
            label: policy-lifecycle
            tests: tests/unit/test_policy_startup.py tests/unit/test_policy_and_manifest_cache.py tests/security/test_policy_activation.py tests/security/test_policy_lifecycle.py tests/security/test_policy_signing.py tests/security/test_policy_phase12.py tests/integration/test_policy_startup_gate.py tests/integration/test_policy_runtime_activation.py
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        if: matrix.phase != 'phase-9'
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Prepare native-isolation Python runtime
        if: matrix.phase == 'phase-9'
        shell: pwsh
        run: |
          $sourceRuntime = python -c "import sys; print(sys.base_prefix)"
          $nativeRuntime = "C:\AISCP-Python312"
          if (Test-Path -LiteralPath $nativeRuntime) {
            throw "Dedicated native-isolation runtime path already exists"
          }
          New-Item -ItemType Directory -Path $nativeRuntime | Out-Null
          Copy-Item -Path (Join-Path $sourceRuntime "*") -Destination $nativeRuntime -Recurse
          & "$nativeRuntime\python.exe" -m pip install --break-system-packages --disable-pip-version-check -e ".[test]"
      - name: Run sanitized phase regression
        shell: pwsh
        run: |
          $python = "python"
          if ("${{ matrix.phase }}" -eq "phase-9") {
            $python = "C:\AISCP-Python312\python.exe"
          }
          $failedTargets = @()
          $testTargets = "${{ matrix.tests }}".Split(
            " ",
            [System.StringSplitOptions]::RemoveEmptyEntries
          )
          for ($targetIndex = 0; $targetIndex -lt $testTargets.Count; $targetIndex++) {
            $testTarget = $testTargets[$targetIndex]
            $capturedLog = Join-Path $env:RUNNER_TEMP "${{ matrix.phase }}-$targetIndex.log"
            & $python -m pytest -q ${{ matrix.pytest_args }} $testTarget *> $capturedLog
            if ($LASTEXITCODE -ne 0) {
              $failedTargets += $testTarget
              $capturedText = Get-Content -LiteralPath $capturedLog -Raw
              $safePattern = (
                "AISCP_SAFE_DIAGNOSTIC: decision=[A-Z_]+;" +
                "reason_codes=[A-Z0-9_,]+;exit_code=(none|-?[0-9]+);" +
                "failure_stage=(none|[A-Z_]+);" +
                "os_error_code=(none|[0-9]+);" +
                "marker_exists=(True|False)"
              )
              [regex]::Matches($capturedText, $safePattern) |
                ForEach-Object { Write-Output $_.Value }
            }
          }
          if ($failedTargets.Count -ne 0) {
            @(
              "## Sanitized regression failure",
              "",
              "Phase: ${{ matrix.phase }}",
              "",
              "Failed test targets:"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            foreach ($failedTarget in $failedTargets) {
              "- $failedTarget" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            Write-Error (
              "${{ matrix.phase }} failed targets: " + ($failedTargets -join ", ")
            )
            exit 1
          }
          Write-Output "${{ matrix.phase }} regression passed"

  r2-live:
    name: Required Cloudflare R2 durability gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_SECURITY_R2_ENDPOINT: ${{ secrets.AI_SECURITY_R2_ENDPOINT }}
      AI_SECURITY_R2_BUCKET: ${{ secrets.AI_SECURITY_R2_BUCKET }}
      AI_SECURITY_R2_ACCESS_KEY_ID: ${{ secrets.AI_SECURITY_R2_ACCESS_KEY_ID }}
      AI_SECURITY_R2_SECRET_ACCESS_KEY: ${{ secrets.AI_SECURITY_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Require R2 trust inputs
        shell: bash
        run: |
          missing=0
          for variable_name in \
            AI_SECURITY_R2_ENDPOINT \
            AI_SECURITY_R2_BUCKET \
            AI_SECURITY_R2_ACCESS_KEY_ID \
            AI_SECURITY_R2_SECRET_ACCESS_KEY
          do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Required R2 secret is missing: ${variable_name}"
              missing=1
            fi
          done
          exit "${missing}"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Verify immutable R2 replication
        run: python -m pytest tests/integration/test_r2_audit_replica_live.py -q

  release-container:
    name: Production container release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release fixture dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Create ephemeral policy trust inputs
        shell: bash
        run: |
          signing_key="$(openssl rand -hex 32)"
          approval_key="$(openssl rand -hex 32)"
          echo "::add-mask::${signing_key}"
          echo "::add-mask::${approval_key}"
          echo "CI=true" >> "${GITHUB_ENV}"
          echo "AI_SECURITY_ENVIRONMENT=production" >> "${GITHUB_ENV}"
          echo "AI_SECURITY_REQUIRE_VERIFIED_POLICY=true" >> "${GITHUB_ENV}"
          echo "AI_SECURITY_POLICY_SIGNER_ID=release-ci-signer" >> "${GITHUB_ENV}"
          echo "AI_SECURITY_POLICY_SIGNING_KEY_HEX=${signing_key}" >> "${GITHUB_ENV}"
          echo "AI_SECURITY_POLICY_APPROVER_ID=release-ci-approver" >> "${GITHUB_ENV}"
          echo "AI_SECURITY_POLICY_APPROVAL_KEY_HEX=${approval_key}" >> "${GITHUB_ENV}"
          echo "AI_SECURITY_POLICY_STORE_PATH=${RUNNER_TEMP}/policy.jsonl" >> "${GITHUB_ENV}"
      - name: Create signed release policy fixture
        run: python scripts/create_ci_policy_fixture.py
      - name: Build digest-pinned image
        shell: bash
        run: |
          docker build --pull --tag "ai-security:${GITHUB_SHA}" .
          mkdir -p .artifacts/release
          docker image inspect --format '{{.Id}}' "ai-security:${GITHUB_SHA}" \
            > .artifacts/release/image-id.txt
          test "$(docker image inspect --format '{{.Config.User}}' "ai-security:${GITHUB_SHA}")" = "aisec"
      - name: Verify production fails closed without trust inputs
        shell: bash
        run: |
          docker run --detach --name ai-security-fail-closed \
            --env AI_SECURITY_ENVIRONMENT=production \
            "ai-security:${GITHUB_SHA}"
          sleep 5
          if [ "$(docker inspect --format '{{.State.Running}}' ai-security-fail-closed)" = "true" ]; then
            echo "::error::Production container started without verified policy inputs"
            exit 1
          fi
          test "$(docker inspect --format '{{.State.ExitCode}}' ai-security-fail-closed)" -ne 0
      - name: Start hardened production container
        shell: bash
        run: |
          chmod 0444 "${AI_SECURITY_POLICY_STORE_PATH}"
          docker run --detach --name ai-security-smoke \
            --read-only \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 512m \
            --cpus 1.0 \
            --publish 127.0.0.1::8000 \
            --mount "type=bind,source=${AI_SECURITY_POLICY_STORE_PATH},target=/policy/policy.jsonl,readonly" \
            --env AI_SECURITY_ENVIRONMENT=production \
            --env AI_SECURITY_REQUIRE_VERIFIED_POLICY=true \
            --env AI_SECURITY_POLICY_SIGNER_ID \
            --env AI_SECURITY_POLICY_SIGNING_KEY_HEX \
            --env AI_SECURITY_POLICY_APPROVER_ID \
            --env AI_SECURITY_POLICY_APPROVAL_KEY_HEX \
            --env AI_SECURITY_POLICY_STORE_PATH=/policy/policy.jsonl \
            "ai-security:${GITHUB_SHA}"
      - name: Verify health and runtime controls
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ai-security-smoke)"
            if [ "${status}" = "healthy" ]; then
              break
            fi
            if [ "${status}" = "unhealthy" ]; then
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' ai-security-smoke)" = "healthy"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' ai-security-smoke)" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' ai-security-smoke | grep -q 'ALL'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' ai-security-smoke | grep -q 'no-new-privileges'
          docker exec ai-security-smoke python -c "import os; raise SystemExit(os.geteuid() == 0)"
          if docker exec ai-security-smoke python -c "open('/app/write-probe', 'w').close()" >/dev/null 2>&1; then
            echo "::error::Read-only root filesystem accepted a write"
            exit 1
          fi
          endpoint="$(docker port ai-security-smoke 8000/tcp | head -n 1)"
          curl --fail --silent --show-error --output /dev/null "http://${endpoint}/v1/health"
      - name: Generate container SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ai-security:${{ github.sha }}
          format: spdx-json
          output-file: .artifacts/release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Reject fixable High and Critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ai-security:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: .artifacts/release/grype.json
      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-container-${{ github.run_id }}
          path: .artifacts/release
          if-no-files-found: warn
          retention-days: 30
      - name: Remove release containers
        if: always()
        shell: bash
        run: |
          docker rm --force ai-security-fail-closed >/dev/null 2>&1 || true
          docker rm --force ai-security-smoke >/dev/null 2>&1 || true

  fault-matrix:
    name: Complete fault matrix and latency gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run complete fault matrix
        run: python -m evaluation --evidence .artifacts/phase11/resilience-evidence.json
      - name: Upload sanitized evidence history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase11-resilience-${{ github.run_id }}
          path: .artifacts/phase11/resilience-evidence.json
          if-no-files-found: warn
          retention-days: 30
