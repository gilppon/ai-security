services:
  control-plane:
    build:
      context: .
    environment:
      AI_SECURITY_ENVIRONMENT: development
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

