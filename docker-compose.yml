services:
  control-plane:
    build:
      context: .
    environment:
      AI_SECURITY_ENVIRONMENT: development
    labels:
      ai-security.environment: development-only
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 10s
    init: true
